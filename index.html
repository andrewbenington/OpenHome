<!doctype html>
<html lang="en" style="height: 100vh; overflow: hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenHome</title>
    <style>
      :root {
        --base-font-size: 14px;

        font-size: var(--base-font-size);
      }

      @media (prefers-color-scheme: light) {
        body {
          --background-gradient: linear-gradient(
            355deg,
            rgba(83, 180, 165, 1) 0%,
            rgba(125, 206, 171, 1) 85%
          );
          background: var(--background-gradient);
        }
      }

      @media (prefers-color-scheme: dark) {
        body {
          --background-gradient: linear-gradient(
            310deg,
            rgba(54, 69, 78, 1) 0%,
            rgba(1, 83, 84, 1) 85%
          );
          background: var(--background-gradient);
        }
      }

      .loading-logo-container {
        height: 100vh;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        position: relative;
      }

      .root {
        isolation: isolate;
      }
    </style>
  </head>

  <body style="height: 100vh; overflow: hidden; margin: 0">
    <div id="root">
      <div class="loading-logo-container">
        <img
          src="logos/logo-full.png"
          style="width: 9rem; height: 9rem; position: absolute"
        />
        <h2 id="loading-screen-subtitle" />
      </div>
    </div>
    <script type="module">
      if (import.meta.env.VITE_UI_TESTING) {
        const subtitleElement = document.getElementById(
          "loading-screen-subtitle",
        );
        if (subtitleElement) {
          subtitleElement.textContent = "UI Testing Build";
        }

        // Necessary for the WDIO ui interaction code to be initialized, but we don't want this in non-ui-testing builds
        import("@wdio/tauri-plugin");
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
